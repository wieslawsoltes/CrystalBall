name: Complete source snapshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive this exact event commit, with per-file checksums
        run: python ci/package_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrystalBall-complete-source
          path: handoff-package/
          if-no-files-found: error
          retention-days: 30
