name: Complete source snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-snapshot.yml'
      - 'ci/package_handoff.py'
      - 'README.md'
      - 'docs/**'
      - 'firmware/**'
      - 'web/**'
      - 'gateway/**'
      - 'factory/**'
      - 'manufacturing/**'
      - 'hardware/**'
      - 'mechanical/**'
      - 'verification/bench-renderer/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-snapshot
  cancel-in-progress: true
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Archive exact event commit, excluding untracked build and credential files
        run: python ci/package_handoff.py
      - uses: actions/upload-artifact@v4
        with:
          name: CrystalBall-complete-source
          path: handoff-package/
          if-no-files-found: error
          retention-days: 30
