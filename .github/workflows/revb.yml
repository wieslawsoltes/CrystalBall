name: Rev B CAD and carrier closure
on:
  push:
    branches: [main]
    paths: ['ci/revb-source.patch', '.github/workflows/revb.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: revb-regeneration
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed source changes once
        run: |
          if git apply --check --unidiff-zero ci/revb-source.patch; then
            git apply --unidiff-zero ci/revb-source.patch
          elif ! grep -q 'Rev B parametric' mechanical/model.py; then
            exit 1
          fi
      - name: Install pinned CAD tools
        run: python -m pip install 'cadquery==2.8.0' 'cadquery-ocp==7.9.3.1.1' 'numpy==2.3.5' 'shapely==2.1.2' 'trimesh==4.11.2'
      - name: Regenerate carrier and project-local libraries
        run: |
          python tools/pcb.py --reroute
          python tools/schematic.py
          python tools/local_libraries.py
      - name: Export corrected CAD and verify topology and interference
        run: |
          python mechanical/model.py
          python tools/check_mechanical.py
          mkdir -p web/assets
          cp preview/assembly-meshes.json web/assets/assembly.json
      - name: Commit engineering outputs without manufacturing approval
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools hardware mechanical preview web/assets/assembly.json
          git commit -m 'engineering: Rev B zero-interference CAD, sealed STL meshes and carrier corrections' || test -z "$(git status --porcelain)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Install independent KiCad
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends kicad
      - name: Independent ERC DRC and parity
        run: |
          mkdir -p verification/kicad
          kicad-cli version >verification/kicad/version.txt
          set +e
          kicad-cli sch erc --format json --severity-all --exit-code-violations -o verification/kicad/erc.json hardware/aether-carrier.kicad_sch >verification/kicad/erc.log 2>&1
          ERC=$?
          kicad-cli pcb drc --format json --severity-all --schematic-parity --exit-code-violations -o verification/kicad/drc.json hardware/aether-carrier.kicad_pcb >verification/kicad/drc.log 2>&1
          DRC=$?
          printf 'ERC=%s\nDRC=%s\n' "$ERC" "$DRC" | tee verification/kicad/exit-codes.txt
          test "$ERC" = 0 && test "$DRC" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revb-verification
          path: |
            verification/
            hardware/reports/
            mechanical/parts.json
