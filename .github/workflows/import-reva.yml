name: Verify preserved Rev A baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f430900c5269cbada520c0550a1a0a9df75eb3ed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify the historical byte-identical import without changing main
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('provenance/reva/SHA256.json').read_text())
          bad = [name for name, digest in manifest.items() if hashlib.sha256(Path(name).read_bytes()).hexdigest() != digest]
          if bad:
              raise SystemExit(f'Baseline verification failed: {bad}')
          print(f'Verified {len(manifest)} original files at preserved baseline. Current main is untouched.')
          PY
