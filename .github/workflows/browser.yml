name: Browser and gateway verification
on:
  push:
    branches: [main]
    paths: ['web/**', 'gateway/**', 'tests/**', 'ci/import_application.py', '.imports/application.*', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-verification
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import application source once
        run: |
          python ci/import_application.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web gateway tests provenance
          if ! git diff --cached --quiet; then
            git commit -m 'feat: WebGPU crystal studio, CAD inspector and secured text/audio/realtime gateway'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Install test dependencies
        run: python -m pip install './gateway[test]' 'playwright==1.57.0'
      - name: Gateway and audio unit tests
        run: |
          mkdir -p verification/browser
          python -m pytest gateway/tests -q | tee verification/browser/gateway-tests.txt
          npm --prefix web test | tee verification/browser/javascript-tests.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start isolated mock-provider gateway
        run: |
          PYTHONPATH=gateway python -m uvicorn --app-dir tests mock_gateway:app --host 127.0.0.1 --port 8088 --no-access-log >verification/browser/gateway.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/healthz; then exit 0; fi
            sleep 1
          done
          cat verification/browser/gateway.log
          exit 1
      - name: Validate WebGPU UI and capture desktop/mobile screenshots
        run: python tests/browser.py 2>&1 | tee verification/browser/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-visual-and-integration-evidence
          path: verification/browser/
