name: Browser and gateway verification
on:
  push:
    branches: [main]
    paths: ['web/**', 'gateway/**', 'tests/**', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-verification
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install './gateway[test]' 'playwright==1.57.0'
      - name: Gateway and audio unit tests
        run: |
          mkdir -p verification/browser
          python -m pytest gateway/tests -q | tee verification/browser/gateway-tests.txt
          npm --prefix web test | tee verification/browser/javascript-tests.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start isolated mock-provider gateway
        run: |
          PYTHONPATH=gateway python -m uvicorn --app-dir tests mock_gateway:app --host 127.0.0.1 --port 8088 --no-access-log >verification/browser/gateway.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/healthz; then exit 0; fi
            sleep 1
          done
          cat verification/browser/gateway.log
          exit 1
      - name: Validate WebGPU UI with the production CSP unchanged
        run: |
          python tests/browser.py 2>&1 | tee verification/browser/test.log
          test -s verification/browser/report.json
          test -s verification/browser/05-mobile.png
          test -s verification/browser/06-fallback.png
          python tests/renderer_browser.py
          python -c "import json; assert json.load(open('verification/renderer/report.json'))['passed']"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-visual-and-integration-evidence
          path: |
            verification/browser/
            verification/renderer/
          if-no-files-found: error
