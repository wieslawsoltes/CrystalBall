<text x="16" y="255" font-family="sans-serif" font-size="2.9" fill="#3b4b57">J4 goes to Adafruit 1770 ILI9341 in SPI mode: close IM1/IM2/IM3 as specified in the module guide.</text>
<text x="16" y="260" font-family="sans-serif" font-size="2.9" fill="#3b4b57">J5: SPH0645 microphone; 3.3 V ONLY. SEL to GND, left slot. Unplug the whole harness for hardware isolation.</text>
<text x="16" y="265" font-family="sans-serif" font-size="2.9" fill="#3b4b57">J6: Adafruit 3006 MAX98357A. Speaker connects directly to amp +/-. Neither output may connect to ground.</text>
<text x="16" y="270" font-family="sans-serif" font-size="2.9" fill="#3b4b57">J8/J9 momentary NO to GND. J10 LED anode pin 1, cathode pin 2. R7 is already on the carrier.</text>
