<text x="16" y="255" font-family="sans-serif" font-size="2.9" fill="#3b4b57">Socket pin numbering is the module top view: antenna at the top, USB connectors at the bottom.</text>
<text x="16" y="260" font-family="sans-serif" font-size="2.9" fill="#3b4b57">Only genuine DevKitC-1 v1.1 N8R8 geometry is qualified by this drawing. No generic ESP32 boards.</text>
<text x="16" y="265" font-family="sans-serif" font-size="2.9" fill="#3b4b57">GPIO0/3/45/46 (straps), GPIO19/20 (USB), GPIO35/36/37 (PSRAM), GPIO38/48 (RGB variants) are not used.</text>
<text x="16" y="270" font-family="sans-serif" font-size="2.9" fill="#3b4b57">Remove the controller module from BOTH sockets before USB flashing. Never connect USB and carrier power together.</text>
