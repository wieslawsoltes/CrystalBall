<text x="16" y="255" font-family="sans-serif" font-size="2.9" fill="#3b4b57">External HUSB238: keep 5V jumper CLOSED; cut 1A and leave 2A OPEN to request 3A. Verify unloaded output first.</text>
<text x="16" y="260" font-family="sans-serif" font-size="2.9" fill="#3b4b57">Q1: drain = FUSED5, source = 5V_SYS, gate = R1 to GND. Reverse-polarity protection, NOT an eFuse or OVP.</text>
<text x="16" y="265" font-family="sans-serif" font-size="2.9" fill="#3b4b57">Use only the qualified 5 V / 3 A PD adapter. Test C1 inrush; F1 derates with enclosure temperature.</text>
<text x="16" y="270" font-family="sans-serif" font-size="2.9" fill="#3b4b57">SN74AHCT1G125 is TTL-compatible. Do not substitute an HC buffer. Keep the LED cable under 100 mm.</text>
</svg>